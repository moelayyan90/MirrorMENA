name: BUILD THIS CI

on:
  push:
    branches: [build-this-final]
    paths:
      - 'build-this/**'
      - '.github/workflows/build-this-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: build-this
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: build-this/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run test:types
      - run: npm run build
