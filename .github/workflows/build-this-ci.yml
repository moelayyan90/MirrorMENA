name: BUILD THIS CI

on:
  push:
    branches: [build-this-final]
    paths:
      - 'build-this/**'
      - '.github/workflows/build-this-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: build-this
    env:
      DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
      DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: build-this/package.json

      - id: install
        name: Install dependencies
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - id: types
        name: Typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:types

      - id: build
        name: Build
        if: steps.types.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - id: auth
        name: Restore Devvit authentication
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "DEVVIT_TOKEN repository secret is missing"
            exit 1
          fi
          mkdir -p "$HOME/.devvit"
          printf '%s' "$DEVVIT_TOKEN" > "$HOME/.devvit/token"
          if [ -n "$DEVVIT_SESSION_ID" ]; then
            printf '%s' "$DEVVIT_SESSION_ID" > "$HOME/.devvit/session-id"
          fi
          npx devvit whoami

      - id: publish
        name: Publish BUILD THIS public update
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        run: npx devvit publish --public --bump patch --verbose

      - name: Report deployment result
        if: always()
        shell: bash
        working-directory: .
        run: |
          BODY=$(cat <<EOF
          Commit: $GITHUB_SHA
          Install: ${{ steps.install.outcome }}
          Typecheck: ${{ steps.types.outcome }}
          Build: ${{ steps.build.outcome }}
          Devvit auth: ${{ steps.auth.outcome }}
          Public publish: ${{ steps.publish.outcome }}
          EOF
          )
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'BUILD THIS deployment status in:title' --json number,title --jq '.[] | select(.title == "BUILD THIS deployment status") | .number' | head -n 1)
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'BUILD THIS deployment status' --body "$BODY"
          fi

      - name: Fail if publish did not complete
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outcome }}" = "success" \
            -a "${{ steps.types.outcome }}" = "success" \
            -a "${{ steps.build.outcome }}" = "success" \
            -a "${{ steps.auth.outcome }}" = "success" \
            -a "${{ steps.publish.outcome }}" = "success"
